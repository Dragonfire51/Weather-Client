name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Offline tests
        run: pytest -q
      - name: GUI tests (Xvfb)
        run: xvfb-run -a pytest tests/test_gui_smoke.py tests/test_packaging.py -m gui -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            python_arch: x64
          - arch: x86
            python_arch: x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Show interpreter architecture
        shell: pwsh
        run: |
          python -c "import struct, platform; print(platform.machine(), struct.calcsize('P') * 8, 'bit')"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Regenerate assets (icons + .ico)
        run: |
          python tools/make_icons.py
          python tools/make_icon_ico.py

      - name: Build the executable
        run: pyinstaller packaging/weather_desktop.spec --noconfirm --clean

      - name: Verify the frozen executable
        shell: pwsh
        run: |
          .\dist\WeatherChannelDesktop.exe --selftest --no-window

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item dist\WeatherChannelDesktop.exe "out\WeatherChannelDesktop-${{ matrix.arch }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: WeatherChannelDesktop-${{ matrix.arch }}
          path: out/WeatherChannelDesktop-${{ matrix.arch }}.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -name "*.exe" -exec cp {} dist/ \;
          ls -l dist

      - name: Compute checksums
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Reset the moving "latest" tag
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --yes --cleanup-tag || true

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          make_latest: "true"
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Publish to the versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
